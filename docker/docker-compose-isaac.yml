services:
  p7-drone-sit-awareness:
    build: 
      context: .
      dockerfile: Dockerfile
    image: p7-drone-sit-awareness:latest
    container_name: p7-drone-sit-awareness-ex
    network_mode: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=42
      - QT_QPA_PLATFORM=xcb
      - XAUTHORITY=${XAUTHORITY:-/root/.Xauthority}
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      - ZENOH_CONFIG_OVERRIDE=mode="client";connect/endpoints=["tcp/192.168.10.232:7447"]
    volumes:
      - /dev/dri/:/dev/dri
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ../ros2_ws:/home/P7_drone_sit_awareness_ws
      - ${XAUTHORITY:-/root/.Xauthority}:${XAUTHORITY:-/root/.Xauthority}:ro
#    user: "1000:1000"

    devices:
      - /dev:/dev

    stdin_open: true  
    tty: true        
