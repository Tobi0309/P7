frontier_segmentation:
  ros__parameters:
    octomap_topic: /octomap_binary # or /octomap_full
    sensor_model: livox_mid360       # or: camera
    sensor_frame: livox_frame       # change to your actual LiDAR optical/sensor frame
    world_frame: camera_init         # FAST-LIO world/parent frame
    robot_frame: body                # FAST-LIO robot/child frame
    occupied_threshold: 0.5
    min_frontier_voxels: 8
    max_frontier_voxels: 1200
    max_width_m: 12.0
    max_height_m: 8.0
    max_extent_m: 15.0
    max_elongation_ratio: 4.0
    min_convexity_ratio: 0.45
    min_range_m: 0.2
    max_range_m: 40.0
    camera_hfov_deg: 90.0
    camera_vfov_deg: 64.0
    lidar_hfov_deg: 360.0
    lidar_vfov_deg: 59.0
    lidar_axis_pitch_deg: 0.0   # pitch should normally already be represented by TF
    frontier_design_range_m: 10.0
    use_fov_extent_limits: false
    positive_z_is_up: false #true
    diagnostics: false
    frontier_topic: /frontier_segments
    marker_topic: /frontier_segments/markers