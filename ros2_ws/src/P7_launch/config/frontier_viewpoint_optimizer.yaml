# Keyed /** so it applies whatever name the launch file gives the node.
/**:
  ros__parameters:
    # Input messages must be in the same frame; map must have native 0.5 m resolution.
    frontier_topic: /frontier_segments
    octomap_topic: /octomap_binary_filtered
    odometry_topic: /Odometry_base_link
    optimized_topic: /frontier_viewpoints
    fov_marker_topic: /frontier_viewpoints/fov_markers
    planning_voxel_size: 0.5

    # Voxel padding: reject candidate viewpoints whose voxel centre is closer than
    # obstacle_padding [m] to an occupied voxel. Use at least DSP's padding
    # (P7_launch/config/dsp.yaml), otherwise DSP treats such viewpoints as blocked, and more
    # than ego-planner's obstacle inflation (0.36 m), otherwise ego-planner moves the goal.
    obstacle_padding_enabled: true
    obstacle_padding: 0.5

    # Sensor model used to score viewpoints. It must match the sensor that builds
    # octomap_topic: a frontier only goes away when that sensor has seen it. Level sensor,
    # yaw-only frame unless transformed upstream.
    # /octomap_binary_filtered only contains LiDAR points inside the forward camera image
    # (pointcloud_fov_filter) up to 10 m (octomap sensor_model.max_range), so the viewpoints
    # are scored with that camera: FOV from /UAV/rgbd_camera/color/camera_info (1280 x 720,
    # fx = fy = 634.1), mount from the URDF camera_joint. The yaw now matters, so yaw_samples
    # directions are scored per candidate. Live A/B run in Isaac Sim (forest4, 6 min): explored
    # camera-map volume 6477 m^3 against 5745 m^3 with the old 360 deg / 40 m LiDAR model and
    # scores (see the report of 2026-11-23).
    horizontal_fov_deg: 90.5
    vertical_fov_min_deg: -29.6
    vertical_fov_max_deg: 29.6
    min_range: 0.3
    max_range: 10.0
    sensor_offset_x: 0.13
    sensor_offset_y: 0.0
    sensor_offset_z: 0.0

    # Frontier geometry drives native-grid candidate sampling.
    # Stand-off from the frontier box; 5 m keeps its far side inside the 10 m camera range.
    candidate_minimum_offset: 1.0
    candidate_maximum_offset: 5.0
    candidate_anchor_spacing: 1.0
    candidate_vertical_spacing: 1.0
    candidate_shell_step: 0.75
    candidate_minimum_count: 32
    candidate_maximum_count: 160
    candidate_maximum_pool: 3000
    frontier_visibility_samples: 48
    yaw_samples: 8
    # 16 candidates x yaw_samples directions are scored in full per frontier.
    reachable_evaluation_limit: 16

    # New/updated frontiers only; reached-zero cases do not retry periodically.
    reachability_max_distance: 25.0
    reachability_max_nodes: 120000
    reachability_max_build_ms: 1500
    optimization_worker_count: 2

    # The optimizer evaluates information quality, not DSP route cost.
    frontier_area_weight: 3.0
    # Weight views into deep unknown space (the next area to fly into) above thin gaps.
    new_volume_weight: 1.0
    volume_score_depth_cap_m: 4.0
    volume_unknown_depth_cap: 6.0
    volume_ray_step: 0.5
    altitude_bias_weight: 0.25
    # Penalty above altitude_reference_z, steep above reference + excess (4.0 m): ego-planner's
    # ceiling is 4.9 m and the forest crowns start at about 4 m. Untested option to remove the
    # last viewpoints above 4 m: excessive_altitude_penalty_weight 30.
    altitude_reference_z: 2.5
    altitude_excess_scale: 1.5
    excessive_altitude_penalty_weight: 5.0

    enable_candidate_refining: false
    refinement_iterations: 2
    refinement_uav_half_extent: 0.18
    refinement_clearance_margin: 0.01
    refinement_voxel_fraction: 0.42
    refinement_yaw_step_deg: 10.0

    # A cached viewpoint persists unchanged unless its frontier is removed,
    # its selected cell becomes occupied, or sightlines are definitively blocked.
    geometry_change_tolerance: 0.65
    cached_visibility_min_fraction: 0.10

    draw_fov_markers: true
    fov_marker_alpha: 0.45
    fov_azimuth_segments: 20
    enable_diagnostics: true
